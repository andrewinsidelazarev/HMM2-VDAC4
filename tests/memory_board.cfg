# fheroes2 configuration file (saved by version 1.1.17)

# !!! WARNING !!!
# Only modify this file if you are absolutely sure of what you are doing!
# !!! WARNING !!!

# Resolution: in-game width x height : on-screen width x height
videomode = 640x480:640x480

# Position of the game's window
game window position = [ -1, -1 ]

# Music type: original, expansion, external
music = external

# Sound volume: 0 - 10
sound volume = 6

# Music volume: 0 - 10
music volume = 6

# Toggle fullscreen mode: on/off
fullscreen = off

# Print debug messages (only for development, see src/engine/logging.h for possible values)
debug = 5460

# Hero movement speed: 1 - 10
heroes speed = 5

# AI movement speed: 0 - 10
ai speed = 5

# Battle animation speed: 1 - 10
battle speed = 4

# Adventure Map scrolling speed: 0 - 4. 0 means no scrolling
scroll speed = 0

# Smooth scrolling when panning the Adventure Map by dragging: on/off
map smooth scrolling = off

# Toggle battle grid: on/off
battle grid = on

# Show battle shadow movement: on/off
battle shadow movement = on

# Show battle shadow cursor: on/off
battle shadow cursor = on

# Highlight battle movement area: on/off
highlight movement area = off

# Show battle damage information: on/off
battle show damage = off

# Enable auto resolve battles: on/off
auto resolve battles = off

# Enable auto combat spell casting: on/off
auto spell casting = off

# Show turn order during battle: on/off
battle turn order = off

# Interface type: good/evil/dynamic
interface type = good

# Hide interface elements on the adventure map: on/off
hide interface = off

# Position of the radar window on the adventure map when interface elements are hidden
radar window position = [ -1, -1 ]

# Position of the buttons window on the adventure map when interface elements are hidden
buttons window position = [ -1, -1 ]

# Position of the icons window on the adventure map when interface elements are hidden
icons window position = [ -1, -1 ]

# Position of the status window on the adventure map when interface elements are hidden
status window position = [ -1, -1 ]

# Game language (an empty value means English)
lang = 

# Controller pointer speed: 0 - 100
controller pointer speed = 10

# First time game run (show additional hints): on/off
first time game run = on

# Show game intro (splash screen and video): on/off
show game intro = on

# Enable V-Sync (Vertical Synchronization) for rendering
v-sync = off

# Enable text support mode that outputs extra information in console window: on/off
text support mode = off

# Toggle monochrome (black and white) cursors in the game: on/off
monochrome cursor = off

# Enable 3D audio for objects on Adventure Map: on/off
3d audio = on

# Display system information: on/off
system info = off

# Perform auto save at the beginning of the turn instead of the end of the turn: on/off
auto save at the beginning of the turn = off

# Enable cursor software rendering: on/off
cursor soft rendering = off

# Screen scaling type: nearest or linear
screen scaling type = linear

# Show object animation in the Editor: on/off
editor animation = on

# Display object passability in the Editor: on/off
editor passability = off

# Save files sorting method: name/date
save file sorting = name

# Show army size estimates: in 'canonical' (few, several, lots, ...) or 'numeric' (1-4, 5-9, 10-19, ...) way
army estimation view type = canonical
